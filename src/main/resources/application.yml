spring:
  jackson:
    # Preserve the existing REST contract while using Jackson 3.
    use-jackson2-defaults: true
  mongodb:
    uri: ${STOREKEEPER_MONGO_URL:mongodb://localhost:27017/storekeeper}
  mail:
    properties:
      mail.smtp.auth: ${STOREKEEPER_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${STOREKEEPER_SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${STOREKEEPER_SMTP_STARTTLS:false}
      mail.smtp.ssl.enable: ${STOREKEEPER_SMTP_SSL:false}
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  data:
    mongodb:
      auto-index-creation: true
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger
config:
  openapi:
    title: API (storekeeper)
    description: API Backend storekeeper. Management articles and services for companies. Soon Deliveries.
    terms: https://google.com
    licence: apache 2.0
    licenceUrl: https://google.com
    version: 1.0
    contact:
      name: CBProjects
      url: https://cbprojects.com
      email: contact@cbprojects.com

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /storekeeper-server
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
  ssl:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

storekeeper:
  public-url: ${STOREKEEPER_PUBLIC_URL:http://localhost:4200}
  allowed-origins: ${STOREKEEPER_ALLOWED_ORIGINS:http://localhost:4200}
  mail:
    from: ${STOREKEEPER_MAIL_FROM:noreply@localhost}
